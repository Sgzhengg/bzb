version: "3.8"

services:
  # ==================== PostgreSQL 数据库 ====================
  db:
    image: postgres:16-alpine
    container_name: bzb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biaozhongbao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biaozhongbao"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端 FastAPI 服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bzb-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/biaozhongbao
      BZB_SCHEDULER_ENABLED: "true"
      BZB_CRAWLER_ENABLED: "true"
      BZB_LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ==================== 前端 React 服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bzb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
