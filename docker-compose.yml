services:
  # ==================== 后端 FastAPI 服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bzb-backend
    restart: unless-stopped
    environment:
      BZB_DATABASE_URL: sqlite+aiosqlite:///./biaozhongbao.db
      BZB_REDIS_URL: ""
      BZB_SCHEDULER_ENABLED: "true"
      BZB_CRAWLER_ENABLED: "true"
      BZB_LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ==================== 前端 React 服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bzb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlite_data:
    driver: local
