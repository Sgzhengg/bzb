services:
  # ==================== 数据库 PostgreSQL 16 ====================
  db:
    image: postgres:16-alpine
    container_name: bzb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bzb
      POSTGRES_PASSWORD: bzb123456
      POSTGRES_DB: biaozhongbao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bzb -d biaozhongbao"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: bzb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== 后端 FastAPI 服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bzb-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BZB_DATABASE_URL: postgresql+asyncpg://bzb:bzb123456@db:5432/biaozhongbao
      BZB_REDIS_URL: redis://redis:6379/0
      BZB_SCHEDULER_ENABLED: "true"
      BZB_CRAWLER_ENABLED: "true"
      BZB_LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ==================== 前端 React 服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bzb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
