<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N8N Template Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #2a2a2a 0%, #383838 100%);
            border: 1px solid #404040;
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff4757, transparent);
            opacity: 0.6;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            animation: logoSpin 2s ease-out;
            transition: transform 0.3s ease;
        }

        @keyframes logoSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .logo:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .title-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .template-name {
            color: #b0b0b0;
            font-size: 1rem;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b7a 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 71, 87, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 71, 87, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            color: #e5e7eb;
            border: 1px solid #6b7280;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            border-color: #9ca3af;
            transform: translateY(-2px);
        }

        .btn-icon {
            font-size: 1.1rem;
        }

        .main-content {
            background: linear-gradient(135deg, #2a2a2a 0%, #333333 100%);
            border: 1px solid #404040;
            border-radius: 16px;
            padding: 0;
            flex: 1;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .main-content:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
        }

        .workflow-container {
            width: 100%;
            height: 100%;
            min-height: 600px;
            position: relative;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(42, 42, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #4b5563;
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #e5e7eb;
            font-weight: 500;
        }

        .error-message {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%);
            color: #fecaca;
            padding: 20px;
            border-radius: 12px;
            margin: 20px;
            border: 1px solid #dc2626;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.2);
        }

        .workflow-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 50;
        }

        /* Override n8n-demo styles for better integration */
        n8n-demo {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 600px;
            --n8n-workflow-min-height: 600px;
            --n8n-json-background-color: #2b2b2b;
        }
    </style>
    
    <!-- n8n-demo Web Components -->
    <script src="lib/webcomponents-loader.js"></script>
    <script src="lib/polyfill-support.js"></script>
    <script type="module" src="lib/n8n-demo.bundled.js"></script>
    
    <!-- GitHub Downloader Module -->
    <script src="modules/i18n-manager.js"></script>
    <script src="modules/github-downloader.js"></script>
    <script src="template-preview.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <img src="icons/icon128.png" alt="N8N Master" class="logo">
                <div class="title-section">
                    <h1 data-i18n="template_preview_title">Template Preview</h1>
                    <div class="template-name" id="template-name" data-i18n="loading_template">Loading template...</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" id="copy-btn">
                    <span class="btn-icon">📋</span>
                    <span data-i18n="copy_json">Copy JSON</span>
                </button>
                <button class="btn btn-primary" id="download-btn">
                    <span class="btn-icon">💾</span>
                    <span data-i18n="download">Download</span>
                </button>
                <button class="btn btn-secondary" id="close-btn">
                    <span class="btn-icon">✕</span>
                    <span data-i18n="close">Close</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <div class="workflow-container">
                <!-- Loading Overlay -->
                <div class="loading-overlay" id="loading-overlay">
                    <div class="loading-spinner"></div>
                    <div class="loading-text" data-i18n="loading_workflow_preview">Loading workflow preview...</div>
                </div>

                <!-- Error Message (hidden by default) -->
                <div class="error-message" id="error-message" style="display: none;">
                    <strong data-i18n="error_loading_template">Error loading template:</strong>
                    <div id="error-details"></div>
                </div>

                <!-- Workflow Stats -->
                <div class="workflow-stats" id="workflow-stats" style="display: none;">
                    <strong id="node-count">0</strong> <span data-i18n="nodes">nodes</span> • 
                    <strong id="connection-count">0</strong> <span data-i18n="connections">connections</span>
                </div>

                <!-- n8n-demo Component Container -->
                <div class="workflow-preview-container" style="--n8n-workflow-min-height: 600px; --n8n-json-background-color: #2b2b2b;">
                    <n8n-demo 
                        id="workflow-demo"
                        theme="dark" 
                        frame="false" 
                        clicktointeract="true" 
                        disableinteractivity="false" 
                        hidecanvaserrors="true" 
                        collapseformobile="true">
                    </n8n-demo>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
