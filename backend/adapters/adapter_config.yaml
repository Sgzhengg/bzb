# ============================================================
# 标中宝 — 数据源适配器配置
# ============================================================

# ── 统一采集调度器 ──
data_collector:
  default_adapter: "zhaobiao"     # 当前主数据源
  fallback_adapter: "gd_zbtb"     # 备用数据源
  failure_threshold: 3            # 连续失败多少次后切换
  auto_fallback: true             # true=自动切换, false=手动切换
  adapters:
    zhaobiao:
      enabled: true
      module: "adapters.zhaobiao_adapter"
      class_name: "ZhaobiaoAdapter"
      config:
        base_url: "https://www.zhaobiao.cn"
        max_pages: 5
        search_keyword: "广东移动 广告"
    gd_zbtb:
      enabled: true
      module: "adapters.gd_zbtb_adapter"
      class_name: "GzZbtbAdapter"
      config:
        base_url: "https://zbtb.gd.gov.cn"
        max_pages: 5
    gd_ygp:
      enabled: true
      module: "adapters.gd_ygp_adapter"
      class_name: "GdYgpAdapter"
      config:
        base_url: "https://ygp.gdzwfw.gov.cn"
        max_pages: 5
    b2b_10086:
      enabled: true
      module: "adapters.b2b_10086_adapter"
      class_name: "B2b10086Adapter"
      config:
        base_url: "https://b2b.10086.cn"
        max_pages: 3

# ── 各数据源详细配置 ──

# 广东招标投标监管网
gd_zbtb:
  name: "广东招标投标监管网"
  base_url: "https://zbtb.gd.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动"
  search_region: "广东"
  enabled: true

# 全国公共资源交易平台（广东省）
gd_ygp:
  name: "广东公共资源交易平台"
  base_url: "https://ygp.gdzwfw.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动 广告"
  enabled: true

# 中国移动采购与招标网（原有，反爬严苛）
b2b_10086:
  name: "中国移动采购与招标网"
  base_url: "https://b2b.10086.cn"
  min_delay: 60.0
  max_delay: 90.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "广东 移动 广告 宣传"
  enabled: true  # 启用此数据源（官方最权威）

# 中国招标网（主数据源）
zhaobiao:
  name: "中国招标网"
  base_url: "https://www.zhaobiao.cn"
  min_delay: 3.0
  max_delay: 6.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动 广告"
  enabled: true

# 采集模式
mode:
  # 可选: sequential（顺序）, parallel（并行）, round_robin（轮询）
  strategy: sequential
  # 广告类过滤: true=仅采集广告类, false=采集全部
  ad_filter: true
  # 自动入库
  auto_save: true

# ── 历史数据采集配置 ──
collector:
  history_mode: true
  start_date: "2023-01-01"
  end_date: "2026-06-26"
  checkpoint_file: "checkpoint.json"
  progress_interval_pages: 10
  progress_interval_items: 50

  request_interval:
    min: 3
    max: 8

  retry:
    max_attempts: 3
    backoff_factor: 2

  # 按域名每分钟请求数限制
  rpm: 12

  # 代理（可选）
  proxy_enabled: false
  proxy_list: []
  # proxy_list:
  #   - "http://user:pass@proxy1:8080"
  #   - "http://user:pass@proxy2:8080"

  # User-Agent 池（在 request_utils.py 中维护）
  user_agents: []  # 空列表 = 使用内置 20 个 UA
