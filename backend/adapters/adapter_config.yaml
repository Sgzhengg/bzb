# ============================================================
# 标中宝 — 数据源适配器配置
# ============================================================

# ── 统一采集调度器 ──
data_collector:
  default_adapter: "b2b_10086"    # 主数据源: 中国移动采购与招标网
  fallback_adapter: "gd_zbtb"     # 备用数据源
  failure_threshold: 3            # 连续失败多少次后切换
  auto_fallback: true             # true=自动切换, false=手动切换
  adapters:
    b2b_10086:
      enabled: true
      module: "adapters.b2b_10086_adapter"
      class_name: "B2b10086Adapter"
      config:
        base_url: "https://b2b.10086.cn"
        max_pages: 3
        source_key: "b2b_10086"
    # V3 新增：电信/联通采购平台适配器
    telecom:
      enabled: true
      module: "adapters.telecom_adapter"
      class_name: "TelecomAdapter"
      config:
        base_url: "https://caigou.chinatelecom.com.cn"
        max_pages: 3
        source_key: "telecom"
    unicom:
      enabled: true
      module: "adapters.unicom_adapter"
      class_name: "UnicomAdapter"
      config:
        base_url: "https://www.chinaunicombidding.cn"
        max_pages: 3
        source_key: "unicom"
    # V2 新增：各省公共资源交易平台适配器
    gx_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "http://gxggzy.gxzf.gov.cn"
        province: "广西"
        max_pages: 3
    fj_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://ggzyfw.fj.gov.cn"
        province: "福建"
        max_pages: 3
    zj_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://zjpubservice.zj.gov.cn"
        province: "浙江"
        max_pages: 3
    hn_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "http://ggzy.hunan.gov.cn"
        province: "湖南"
        max_pages: 3
    ah_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://ggzy.ah.gov.cn"
        province: "安徽"
        max_pages: 3
    sd_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "http://ggzyjy.shandong.gov.cn"
        province: "山东"
        max_pages: 3
    hi_ggzy:
      enabled: false   # province_ggzy_adapter 尚未实现
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://zw.hainan.gov.cn/ggzy"
        province: "海南"
        max_pages: 2
    gd_zbtb:
      enabled: true
      module: "adapters.gd_zbtb_adapter"
      class_name: "GzZbtbAdapter"
      config:
        base_url: "https://zbtb.gd.gov.cn"
        max_pages: 5
        source_key: "gd_zbtb"
    gd_ygp:
      enabled: true
      module: "adapters.gd_ygp_adapter"
      class_name: "GdYgpAdapter"
      config:
        base_url: "https://ygp.gdzwfw.gov.cn"
        max_pages: 5
        source_key: "gd_ygp"

# ── 各数据源详细配置 ──

# 广东招标投标监管网
gd_zbtb:
  name: "广东招标投标监管网"
  base_url: "https://zbtb.gd.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动"
  search_region: "广东"
  enabled: true

# 全国公共资源交易平台（广东省）
gd_ygp:
  name: "广东公共资源交易平台"
  base_url: "https://ygp.gdzwfw.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动 广告"
  enabled: true

# 中国移动采购与招标网（全国平台，主数据源）
b2b_10086:
  name: "中国移动采购与招标网"
  base_url: "https://b2b.10086.cn"
  min_delay: 60.0
  max_delay: 90.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "移动 广告 宣传"  # V2: 去除省份限定
  enabled: true

