# 采集模式
mode:
  # 可选: sequential（顺序）, parallel（并行）, round_robin（轮询）
  strategy: sequential
  # 广告类过滤: true=仅采集广告类, false=采集全部
  ad_filter: true
  # 自动入库
  auto_save: true

# ── 历史数据采集配置 ──
collector:
  history_mode: true
  start_date: "2023-01-01"
  end_date: "2026-06-26"
  checkpoint_file: "checkpoint.json"
  progress_interval_pages: 10
  progress_interval_items: 50

  request_interval:
    min: 3
    max: 8

  retry:
    max_attempts: 3
    backoff_factor: 2

  # 按域名每分钟请求数限制
  rpm: 12

  # 代理（可选）
  proxy_enabled: false
  proxy_list: []
  # proxy_list:
  #   - "http://user:pass@proxy1:8080"
  #   - "http://user:pass@proxy2:8080"

  # User-Agent 池（在 request_utils.py 中维护）
  user_agents: []  # 空列表 = 使用内置 20 个 UA
