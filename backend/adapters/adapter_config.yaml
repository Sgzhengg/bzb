# ============================================================
# 标中宝 — 数据源适配器配置
# ============================================================

# ── 统一采集调度器 ──
data_collector:
  default_adapter: "b2b_10086"    # 主数据源: 中国移动采购与招标网
  fallback_adapter: "gd_zbtb"     # 备用数据源
  failure_threshold: 3            # 连续失败多少次后切换
  auto_fallback: true             # true=自动切换, false=手动切换
  adapters:
    # ═══ 运营商 ═══
    b2b_10086:
      enabled: true
      category: operator
      module: "adapters.b2b_10086_adapter"
      class_name: "B2b10086Adapter"
      config:
        base_url: "https://b2b.10086.cn"
        max_pages: 3
        source_key: "b2b_10086"
    telecom:
      enabled: true
      category: operator
      module: "adapters.telecom_adapter"
      class_name: "TelecomAdapter"
      config:
        base_url: "https://caigou.chinatelecom.com.cn"
        max_pages: 3
        source_key: "telecom"
    unicom:
      enabled: true
      category: operator
      module: "adapters.unicom_adapter"
      class_name: "UnicomAdapter"
      config:
        base_url: "https://www.chinaunicombidding.cn"
        max_pages: 3
        source_key: "unicom"

    # ═══ 政府单位 ═══
    ccgp:
      enabled: true
      category: government
      module: "adapters.ccgp_adapter"
      class_name: "CcgpAdapter"
      config:
        base_url: "https://www.ccgp.gov.cn"
        max_pages: 3
        source_key: "ccgp"

    # ═══ 公共资源交易平台（各省） ═══
    gx_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "http://gxggzy.gxzf.gov.cn"
        province: "广西"
        max_pages: 3
        source_key: "gx_ggzy"
    fj_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://ggzyfw.fj.gov.cn"
        province: "福建"
        max_pages: 3
        source_key: "fj_ggzy"
    zj_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://zjpubservice.zj.gov.cn"
        province: "浙江"
        max_pages: 3
        source_key: "zj_ggzy"
    hn_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "http://ggzy.hunan.gov.cn"
        province: "湖南"
        max_pages: 3
        source_key: "hn_ggzy"
    ah_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://ggzy.ah.gov.cn"
        province: "安徽"
        max_pages: 3
        source_key: "ah_ggzy"
    sd_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "http://ggzyjy.shandong.gov.cn"
        province: "山东"
        max_pages: 3
        source_key: "sd_ggzy"
    hi_ggzy:
      enabled: true
      category: government
      module: "adapters.province_ggzy_adapter"
      class_name: "ProvinceGgzyAdapter"
      config:
        base_url: "https://zw.hainan.gov.cn/ggzy"
        province: "海南"
        max_pages: 2
        source_key: "hi_ggzy"
    gd_zbtb:
      enabled: true
      category: government
      module: "adapters.gd_zbtb_adapter"
      class_name: "GzZbtbAdapter"
      config:
        base_url: "https://zbtb.gd.gov.cn"
        max_pages: 5
        source_key: "gd_zbtb"
    gd_ygp:
      enabled: true
      category: government
      module: "adapters.gd_ygp_adapter"
      class_name: "GdYgpAdapter"
      config:
        base_url: "https://ygp.gdzwfw.gov.cn"
        max_pages: 5
        source_key: "gd_ygp"

# ═══ 各数据源详细配置 ═══
gd_zbtb:
  name: "广东招标投标监管网"
  base_url: "https://zbtb.gd.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动"
  search_region: "广东"
  enabled: true

gd_ygp:
  name: "广东公共资源交易平台"
  base_url: "https://ygp.gdzwfw.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 5
  search_keyword: "广东移动 广告"
  enabled: true

b2b_10086:
  name: "中国移动采购与招标网"
  base_url: "https://b2b.10086.cn"
  min_delay: 60.0
  max_delay: 90.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "移动 广告 宣传"
  enabled: true

gx_ggzy:
  name: "广西公共资源交易平台"
  base_url: "http://gxggzy.gxzf.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "广西移动 广告"
  search_region: "广西"
  enabled: true

fj_ggzy:
  name: "福建公共资源交易平台"
  base_url: "https://ggzyfw.fj.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "福建移动 广告"
  search_region: "福建"
  enabled: true

zj_ggzy:
  name: "浙江公共资源交易平台"
  base_url: "https://zjpubservice.zj.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "浙江移动 广告"
  search_region: "浙江"
  enabled: true

hn_ggzy:
  name: "湖南公共资源交易平台"
  base_url: "http://ggzy.hunan.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "湖南移动 广告"
  search_region: "湖南"
  enabled: true

ah_ggzy:
  name: "安徽公共资源交易平台"
  base_url: "https://ggzy.ah.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "安徽移动 广告"
  search_region: "安徽"
  enabled: true

sd_ggzy:
  name: "山东公共资源交易平台"
  base_url: "http://ggzyjy.shandong.gov.cn"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 3
  search_keyword: "山东移动 广告"
  search_region: "山东"
  enabled: true

hi_ggzy:
  name: "海南公共资源交易平台"
  base_url: "https://zw.hainan.gov.cn/ggzy"
  min_delay: 4.0
  max_delay: 7.0
  max_retries: 3
  timeout: 30
  max_pages: 2
  search_keyword: "海南移动 广告"
  search_region: "海南"
  enabled: true

# ── 采集模式 ──
mode:
  strategy: sequential
  ad_filter: true
  auto_save: true

# ── 历史数据采集配置 ──
collector:
  history_mode: true
  start_date: "2023-01-01"
  end_date: "2026-06-26"
  checkpoint_file: "checkpoint.json"
  progress_interval_pages: 10
  progress_interval_items: 50
  request_interval:
    min: 3
    max: 8
  retry:
    max_attempts: 3
    backoff_factor: 2
  rpm: 12
  proxy_enabled: false
  proxy_list: []
  user_agents: []
